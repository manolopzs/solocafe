services:
  - type: postgres
    name: solocafe-db
    plan: free
    ipAllowList: []

  - type: web
    name: solocafe-api
    plan: free
    runtime: docker
    repo: https://github.com/manolopzs/solocafe
    branch: main
    rootDir: api
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SECRET_KEY_BASE
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: APP_URL
        sync: false
      - key: MAILER_FROM
        sync: false
      - key: SMTP_ADDRESS
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER_NAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: solocafe-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: PLATFORM_FEE_PERCENT
        value: "0"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://solo-cafe-nine.vercel.app,https://solocafe.vercel.app"
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
